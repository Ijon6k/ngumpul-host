user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version in the Server header
    server_tokens off;

    # Larger header buffers for proxied responses (e.g. SvelteKit SSR cookies)
    large_client_header_buffers 4 16k;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS resolver for dynamic upstreams
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Trusted protocol detection. When a client terminates TLS upstream (Cloudflare,
    # Caddy, HAProxy), $scheme stays "http"; the real scheme arrives in X-Forwarded-Proto.
    # Only https/http are trusted; anything else falls back to the connection scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # Explicitly configured upstreams
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    # ==========================================================================
    # Ngumpul Host — Core Application & API (Serves all traffic to this port)
    # ==========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Common proxy settings hoisted to server level (inherited by every location).
        # Connection "" enables HTTP/1.1 upstream keepalive; the app uses no WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Backend REST API
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_read_timeout 90s;
        }

        # Media & File Uploads (served by backend, which owns the Cache-Control header)
        location /uploads/ {
            proxy_pass http://backend_upstream;
        }

        # Outbound Project Redirect & Visit Tracking
        location /go/ {
            proxy_pass http://backend_upstream;
        }

        # Health Check
        location = /health {
            proxy_pass http://backend_upstream/health;
        }

        # Frontend SvelteKit Application
        location / {
            proxy_pass http://frontend_upstream;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
            proxy_hide_header Link;
        }
    }
}