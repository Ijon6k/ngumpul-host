name: Ngumpul Host CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend CI (Go Test & Vet)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Go 1.22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go dependencies
        run: |
          go mod tidy
          go mod download

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go unit tests
        run: go test -v ./... || true

  # ---------------------------------------------------------------------------
  # Job 2: Frontend CI (SvelteKit + Bun)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (SvelteKit & Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SvelteKit application
        run: bun run build

  # ---------------------------------------------------------------------------
  # Job 3: Docker Multi-Stage Build & Push to GHCR
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Tagging Strategy for Backend ---
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ngumpul-host/backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Tagging Strategy for Frontend ---
      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ngumpul-host/frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 4: Integration & Smoke Testing (Port 1111 Verification)
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Local Stack Simulation & Smoke Test
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Full Stack with Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for API and Service Health
        run: |
          echo "Waiting for services to become healthy on port 1111..."
          for i in {1..30}; do
            if curl -s -f http://localhost:1111/health | grep -q '"status":"healthy"'; then
              echo "Ngumpul Host API healthy on port 1111!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Healthcheck timed out!"
          docker compose -f docker-compose.dev.yml logs
          exit 1

      - name: Verify Frontend SSR Status 200
        run: |
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" http://localhost:1111/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Frontend SSR responded with HTTP 200."
          else
            echo "Unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
