# ==============================================================================
# Ngumpul Host — Development Compose (builds from source)
# Usage: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

services:

  # 1. Reverse Proxy — Nginx (reads from ./nginx/nginx.conf, editable without rebuild)
  nginx:
    image: nginx:1.27-alpine
    container_name: ngumpul_nginx_dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-1111}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ngumpul_net

  # 2. Frontend — built from ./frontend/Dockerfile
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ngumpul_frontend_dev
    restart: unless-stopped
    environment:
      PORT:        3000
      NODE_ENV:    production
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - ngumpul_net

  # 3. Backend — built from ./backend/Dockerfile
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ngumpul_backend_dev
    restart: unless-stopped
    environment:
      APP_ENV:         ${APP_ENV:-development}
      PORT:            8080
      DATABASE_URL:    postgres://${POSTGRES_USER:-ngumpul}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-ngumpul_db}?sslmode=disable
      SESSION_SECRET:  ${SESSION_SECRET:-dev_secret_replace_in_production_min32c}
      SESSION_SECURE:  ${SESSION_SECURE:-false}
      STORAGE_DRIVER:  ${STORAGE_DRIVER:-s3}
      STORAGE_PATH:    /data/uploads
      S3_ENDPOINT:     ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION:       ${S3_REGION:-us-east-1}
      S3_BUCKET:       ${S3_BUCKET:-ngumpul-uploads}
      S3_ACCESS_KEY:   ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY:   ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL:   ${S3_PUBLIC_URL:-/uploads}
      SMTP_HOST:       ${SMTP_HOST:-}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USERNAME:   ${SMTP_USERNAME:-}
      SMTP_PASSWORD:   ${SMTP_PASSWORD:-}
      SMTP_FROM:       ${SMTP_FROM:-Ngumpul Host <no-reply@example.com>}
    volumes:
      - uploads_data_dev:/data/uploads
      - /etc/os-release:/host/etc/os-release:ro
      - /sys:/host/sys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ngumpul_net

  # 4. Database — PostgreSQL 16 (port exposed for direct local access)
  postgres:
    image: postgres:16-alpine
    container_name: ngumpul_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ngumpul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB:       ${POSTGRES_DB:-ngumpul_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngumpul} -d ${POSTGRES_DB:-ngumpul_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ngumpul_net

  # 5. External Heartbeat Checker (Independent probe outside backend to detect outages & state changes)
  checker:
    image: alpine:3.20
    container_name: ngumpul_checker_dev
    restart: unless-stopped
    command: >
      sh -c '
        apk add --no-cache curl > /dev/null 2>&1
        echo "External heartbeat checker active. Probing http://nginx/health every 300s..."
        while true; do
          sleep 300
          curl -s -f http://nginx/health > /dev/null 2>&1 || echo "[$(date)] Server DOWN detected by external checker"
        done
      '
    depends_on:
      - nginx
    networks:
      - ngumpul_net

  # 6. Object Storage — SeaweedFS (S3-compatible, private internal network)
  seaweedfs:
    image: chrislusf/seaweedfs:3.75
    container_name: ngumpul_seaweedfs_dev
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333"
    volumes:
      - seaweedfs_data_dev:/data
    networks:
      - ngumpul_net

networks:
  ngumpul_net:
    driver: bridge

volumes:
  postgres_data_dev:
  uploads_data_dev:
  seaweedfs_data_dev:
