# ==============================================================================
# Ngumpul Host — Standalone Self-Hosted Docker Compose
# Download only this file, then: cp .env.example .env && docker compose up -d
# Zero local file dependencies — Nginx config is generated inline via entrypoint.
# ==============================================================================

services:

  # 1. Reverse Proxy — Nginx (all traffic enters here on port 1111)
  nginx:
    image: nginx:1.27-alpine
    container_name: ngumpul_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-1111}:80"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        resolver 127.0.0.11 valid=10s ipv6=off;
        client_max_body_size 10M;

        server {
            listen 80;
            server_name _;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            location /api/ {
                set $$backend http://backend:8080;
                proxy_pass $$backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_read_timeout 90s;
            }

            location /uploads/ {
                set $$backend http://backend:8080;
                proxy_pass $$backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }

            location = /health {
                set $$backend http://backend:8080;
                proxy_pass $$backend/health;
                proxy_set_header Host $$host;
            }

            location / {
                set $$frontend http://frontend:3000;
                proxy_pass $$frontend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        EOF
        exec nginx -g "daemon off;"
    depends_on:
      - frontend
      - backend
    networks:
      - ngumpul_net

  # 2. Frontend — SvelteKit SSR
  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/ijon6k/ngumpul-host/frontend}:${IMAGE_TAG:-latest}
    container_name: ngumpul_frontend
    restart: always
    environment:
      PORT:        3000
      NODE_ENV:    production
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - ngumpul_net

  # 3. Backend — Go API
  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/ijon6k/ngumpul-host/backend}:${IMAGE_TAG:-latest}
    container_name: ngumpul_backend
    restart: always
    environment:
      APP_ENV:         ${APP_ENV:-production}
      APP_URL:         ${APP_URL:-http://localhost:1111}
      PORT:            8080
      DATABASE_URL:    postgres://${POSTGRES_USER:-ngumpul}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ngumpul_db}?sslmode=disable
      SESSION_SECRET:  ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      STORAGE_DRIVER:  ${STORAGE_DRIVER:-s3}
      STORAGE_PATH:    /data/uploads
      S3_ENDPOINT:     ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION:       ${S3_REGION:-us-east-1}
      S3_BUCKET:       ${S3_BUCKET:-ngumpul-uploads}
      S3_ACCESS_KEY:   ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY:   ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL:   ${S3_PUBLIC_URL:-/uploads}
      SMTP_HOST:       ${SMTP_HOST:-}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USERNAME:   ${SMTP_USERNAME:-}
      SMTP_PASSWORD:   ${SMTP_PASSWORD:-}
      SMTP_FROM:       ${SMTP_FROM:-Ngumpul Host <no-reply@example.com>}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ngumpul_net

  # 4. Database — PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: ngumpul_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ngumpul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-ngumpul_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngumpul} -d ${POSTGRES_DB:-ngumpul_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ngumpul_net

  # 5. Object Storage — SeaweedFS (S3-compatible, private internal network)
  seaweedfs:
    image: chrislusf/seaweedfs:3.75
    container_name: ngumpul_seaweedfs
    restart: always
    command: "server -dir=/data -s3 -s3.port=8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - ngumpul_net

networks:
  ngumpul_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  seaweedfs_data:
