<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%2379AFC4%22/></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Ngumpul Host — A small corner of the internet for friends, projects, and experiments</title>
		<meta name="description" content="An open-source, self-hostable community and project portal built around a shared hosting environment." />

		<!-- Google Fonts: Plus Jakarta Sans (Samsung sharp geometric punch), Geist & Inter (Apple & Linear precision), JetBrains Mono (precision telemetry) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

		<!-- Inline script to avoid theme flash -->
		<script>
			try {
				const savedTheme = localStorage.getItem('ngumpul_theme');
				if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.setAttribute('data-theme', 'dark');
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
